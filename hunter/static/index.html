<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base Meme Coin Hunter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg: #0a0b0f; --card: #111318; --border: #1e2130; }
    body { background: var(--bg); font-family: system-ui, sans-serif; }
    .tab-active { border-bottom: 2px solid #6366f1; color: #a5b4fc; }
    .tab { color: #6b7280; border-bottom: 2px solid transparent; }
    .gem { border-left: 3px solid #10b981; }
    .strong { border-left: 3px solid #f59e0b; }
    .watchlist { border-left: 3px solid #374151; }
    .badge-gem { background:#065f46;color:#6ee7b7; }
    .badge-strong { background:#78350f;color:#fde68a; }
    .badge-watchlist { background:#1f2937;color:#9ca3af; }
    .badge-signal { background:#312e81;color:#c7d2fe; }
    .sig-NEW_LISTING { background:#14532d;color:#86efac; }
    .sig-MOMENTUM { background:#7c2d12;color:#fdba74; }
    .sig-BREAKOUT { background:#1e1b4b;color:#a5b4fc; }
    .pos-open { border-left:3px solid #6366f1; }
    .pos-closed-win { border-left:3px solid #10b981; }
    .pos-closed-loss { border-left:3px solid #ef4444; }
    .row:hover { background:#151820; }
    .pulse { animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0a0b0f}
    ::-webkit-scrollbar-thumb{background:#1e2130;border-radius:4px}
  </style>
</head>
<body class="text-gray-200 min-h-screen">

<!-- Header -->
<div class="border-b border-gray-800 px-6 py-3 flex items-center justify-between sticky top-0 z-10" style="background:var(--bg)">
  <div class="flex items-center gap-3">
    <div class="w-2 h-2 rounded-full bg-emerald-400 pulse"></div>
    <span class="font-semibold text-white tracking-tight">Base Meme Coin Hunter</span>
    <span class="text-xs text-gray-500 ml-1">Aerodrome · Base</span>
  </div>
  <div class="flex items-center gap-5 text-sm">
    <div id="header-stats" class="flex gap-4 text-gray-400 text-xs"></div>
    <div id="trading-mode" class="text-xs px-2 py-0.5 rounded font-bold"></div>
    <div class="text-xs text-gray-600" id="last-update">—</div>
  </div>
</div>

<div class="max-w-7xl mx-auto px-4 py-4">

  <!-- Tabs -->
  <div class="flex gap-1 mb-5 border-b border-gray-800">
    <button onclick="setTab('all')"       id="tab-all"       class="tab tab-active px-4 py-2 text-sm font-medium">All Tokens</button>
    <button onclick="setTab('gems')"      id="tab-gems"      class="tab px-4 py-2 text-sm font-medium">Gems</button>
    <button onclick="setTab('signals')"   id="tab-signals"   class="tab px-4 py-2 text-sm font-medium">Signals</button>
    <button onclick="setTab('positions')" id="tab-positions" class="tab px-4 py-2 text-sm font-medium">Positions</button>
    <button onclick="setTab('trades')"    id="tab-trades"    class="tab px-4 py-2 text-sm font-medium">Trade Log</button>
    <button onclick="setTab('movers')"    id="tab-movers"    class="tab px-4 py-2 text-sm font-medium">Top Movers</button>
    <button onclick="setTab('hot')"       id="tab-hot"       class="tab px-4 py-2 text-sm font-medium">Hot Pairs</button>
  </div>

  <!-- Stats bar -->
  <div class="grid grid-cols-7 gap-2 mb-5">
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold text-white" id="s-tracked">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Tracked</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold text-emerald-400" id="s-gems">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Gems</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold text-amber-400" id="s-strong">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Strong</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold text-indigo-400" id="s-open">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Open</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold text-gray-200" id="s-total-trades">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Trades</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold" id="s-winrate">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Win Rate</div>
    </div>
    <div class="rounded-lg p-3 text-center" style="background:var(--card);border:1px solid var(--border)">
      <div class="text-xl font-bold" id="s-pnl">—</div>
      <div class="text-xs text-gray-500 mt-0.5">Total P&amp;L</div>
    </div>
  </div>

  <!-- Views -->
  <div id="view-all"       class="view-panel"><div id="token-table"></div></div>
  <div id="view-gems"      class="view-panel hidden"><div id="gems-table"></div></div>
  <div id="view-signals"   class="view-panel hidden"><div id="signals-list"></div></div>
  <div id="view-positions" class="view-panel hidden"><div id="positions-list"></div></div>
  <div id="view-trades"    class="view-panel hidden"><div id="trades-list"></div></div>
  <div id="view-movers"    class="view-panel hidden"><div id="movers-table"></div></div>
  <div id="view-hot"       class="view-panel hidden"><div id="hot-table"></div></div>
</div>

<script>
let currentTab = 'all';
const BASE_URL = window.location.pathname.startsWith('/hunter') ? '/hunter' : '';

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-' + tab).classList.remove('hidden');
  document.querySelectorAll('[id^="tab-"]').forEach(el => { el.classList.remove('tab-active'); el.classList.add('tab'); });
  const btn = document.getElementById('tab-' + tab);
  btn.classList.add('tab-active'); btn.classList.remove('tab');
  refresh();
}

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtUSD(n) {
  if (!n && n !== 0) return '—';
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}
function fmtAge(h) { return h < 1 ? Math.round(h*60)+'m' : h.toFixed(1)+'h'; }
function fmtPct(v, decimals=2) {
  if (v === undefined || v === null) return '—';
  const color = v >= 0 ? 'text-emerald-400' : 'text-red-400';
  return `<span class="${color}">${v >= 0 ? '+' : ''}${v.toFixed(decimals)}%</span>`;
}
function scoreBar(score) {
  const w = Math.min(100, Math.round(score));
  const color = score >= 75 ? '#10b981' : score >= 50 ? '#f59e0b' : '#374151';
  return `<div class="flex items-center gap-2">
    <div class="flex-1 h-1.5 rounded-full bg-gray-800"><div class="h-1.5 rounded-full" style="width:${w}%;background:${color}"></div></div>
    <span class="text-xs font-mono w-8 text-right text-gray-300">${score.toFixed(0)}</span>
  </div>`;
}
function catBadge(cat) {
  const map = { GEM:'badge-gem', STRONG:'badge-strong', WATCHLIST:'badge-watchlist' };
  return `<span class="text-xs px-2 py-0.5 rounded font-semibold ${map[cat]||'badge-watchlist'}">${cat}</span>`;
}
function sigBadges(sigs) {
  if (!sigs || !sigs.length) return '';
  return sigs.map(s => `<span class="text-xs px-1.5 py-0.5 rounded badge-signal">${s.replace('_',' ')}</span>`).join(' ');
}

// ─── Token table ──────────────────────────────────────────────────────────────
function tokenRows(tokens) {
  if (!tokens || !tokens.length)
    return `<div class="text-center py-16 text-gray-600">No tokens yet. Waiting for data...</div>`;
  return `<div class="rounded-lg overflow-hidden" style="border:1px solid var(--border)">
  <table class="w-full text-sm">
    <thead><tr class="text-xs text-gray-500 uppercase tracking-wider" style="background:var(--card);border-bottom:1px solid var(--border)">
      <th class="px-4 py-3 text-left">Token</th>
      <th class="px-4 py-3 text-left">Score</th>
      <th class="px-4 py-3 text-right">Price</th>
      <th class="px-4 py-3 text-right">Liquidity</th>
      <th class="px-4 py-3 text-right">Vol 24h</th>
      <th class="px-4 py-3 text-right">Vol Spike</th>
      <th class="px-4 py-3 text-right">Age</th>
      <th class="px-4 py-3 text-right">5m</th>
      <th class="px-4 py-3 text-right">1h</th>
      <th class="px-4 py-3 text-right">Buy%</th>
      <th class="px-4 py-3 text-left">Status</th>
    </tr></thead>
    <tbody>` +
    tokens.map(t => {
      const cls = t.category === 'GEM' ? 'gem' : t.category === 'STRONG' ? 'strong' : 'watchlist';
      const buyPct = t.buyRatio ? (t.buyRatio*100).toFixed(0) : '?';
      const spikeColor = (t.volumeSpike||0) >= 2 ? 'text-emerald-400' : 'text-gray-400';
      const spikeStr = t.volumeSpike > 0 ? `<span class="${spikeColor}">${t.volumeSpike.toFixed(1)}x</span>` : '<span class="text-gray-600">—</span>';
      return `<tr class="row border-b border-gray-800/60 ${cls} transition-colors cursor-pointer" onclick="window.open('https://dexscreener.com/base/${t.pairAddress}','_blank')">
        <td class="px-4 py-3"><div class="flex flex-col"><span class="font-semibold text-white">${t.symbol||'?'}</span><span class="text-xs text-gray-500">${(t.name||'').slice(0,20)}</span></div></td>
        <td class="px-4 py-3 w-36">${scoreBar(t.score)}</td>
        <td class="px-4 py-3 text-right font-mono text-gray-300 text-xs">${t.price>0?'$'+t.price.toPrecision(4):'—'}</td>
        <td class="px-4 py-3 text-right text-gray-300">${fmtUSD(t.liquidity)}</td>
        <td class="px-4 py-3 text-right text-gray-300">${fmtUSD(t.volume24h)}</td>
        <td class="px-4 py-3 text-right">${spikeStr}</td>
        <td class="px-4 py-3 text-right text-gray-400">${fmtAge(t.pairAgeHours)}</td>
        <td class="px-4 py-3 text-right">${fmtPct(t.priceChange5m)}</td>
        <td class="px-4 py-3 text-right">${fmtPct(t.priceChange1h)}</td>
        <td class="px-4 py-3 text-right text-xs"><span class="${t.buyRatio>=0.65?'text-emerald-400':'text-gray-400'}">${buyPct}%</span></td>
        <td class="px-4 py-3"><div class="flex flex-wrap gap-1">${catBadge(t.category)}${sigBadges(t.signals)}</div></td>
      </tr>`;
    }).join('') +
    `</tbody></table></div>`;
}

// ─── Signals ──────────────────────────────────────────────────────────────────
function renderSignals(signals) {
  if (!signals || !signals.length)
    return `<div class="text-center py-16 text-gray-600">No signals detected yet.</div>`;
  const colorMap = { NEW_LISTING:'sig-NEW_LISTING', MOMENTUM:'sig-MOMENTUM', BREAKOUT:'sig-BREAKOUT' };
  return `<div class="space-y-2">` + signals.map(s => `
    <div class="rounded-lg px-4 py-3 flex items-center justify-between" style="background:var(--card);border:1px solid var(--border)">
      <div class="flex items-center gap-3">
        <span class="text-xs px-2 py-0.5 rounded font-bold ${colorMap[s.type]||'badge-signal'}">${s.type.replace('_',' ')}</span>
        <span class="font-semibold text-white">${s.symbol}</span>
        <span class="text-sm text-gray-400">${s.detail}</span>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-indigo-400 font-mono">Score: ${s.score.toFixed(1)}</span>
        <span class="text-gray-600 text-xs">${new Date(s.timestamp).toLocaleTimeString()}</span>
        <a href="https://dexscreener.com/base/${s.pairAddress}" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300">View →</a>
      </div>
    </div>`).join('') + `</div>`;
}

// ─── Positions ────────────────────────────────────────────────────────────────
function renderPositions(positions) {
  if (!positions || !positions.length)
    return `<div class="text-center py-16 text-gray-600">No positions yet. Engine is scanning for entry signals...</div>`;
  return `<div class="space-y-3">` + positions.map(p => {
    const isOpen = p.status === 'OPEN';
    const pnlColor = p.pnlPercent >= 0 ? 'text-emerald-400' : 'text-red-400';
    const borderCls = isOpen ? 'pos-open' : (p.pnlPercent >= 0 ? 'pos-closed-win' : 'pos-closed-loss');
    const holdMin = isOpen ? Math.round((Date.now() - new Date(p.entryTime).getTime()) / 60000) : null;
    const modeBadge = p.mode === 'LIVE'
      ? '<span class="text-xs px-1.5 py-0.5 rounded bg-red-900 text-red-300 font-bold">LIVE</span>'
      : '<span class="text-xs px-1.5 py-0.5 rounded bg-gray-800 text-gray-400">PAPER</span>';
    return `
    <div class="${borderCls} rounded-lg p-4" style="background:var(--card);border:1px solid var(--border)">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          ${modeBadge}
          <div>
            <span class="font-semibold text-white text-base">${p.symbol}</span>
            ${isOpen ? `<span class="ml-2 text-xs text-indigo-400 font-medium">OPEN · ${holdMin}m ago</span>` : `<span class="ml-2 text-xs text-gray-500">CLOSED</span>`}
          </div>
          ${p.tp1Hit ? '<span class="text-xs px-1.5 py-0.5 rounded bg-amber-900 text-amber-300">TP1 ✓</span>' : ''}
        </div>
        <div class="text-right">
          <div class="text-xl font-bold ${pnlColor}">${p.pnlPercent >= 0 ? '+' : ''}${p.pnlPercent.toFixed(2)}%</div>
          <div class="text-xs text-gray-500">${p.remainingPct.toFixed(0)}% remaining</div>
        </div>
      </div>
      <div class="mt-3 grid grid-cols-4 gap-4 text-sm">
        <div><div class="text-gray-500 text-xs">Entry</div><div class="font-mono text-gray-300">$${p.entryPrice.toPrecision(4)}</div></div>
        <div><div class="text-gray-500 text-xs">Current</div><div class="font-mono ${pnlColor}">$${(p.currentPrice||p.entryPrice).toPrecision(4)}</div></div>
        <div><div class="text-gray-500 text-xs">Size</div><div class="text-gray-300">$${p.sizeUSD.toFixed(2)}</div></div>
        <div><div class="text-gray-500 text-xs">Exit</div><div class="text-gray-400 text-xs">${p.exitReason||'—'}</div></div>
      </div>
      ${p.fills && p.fills.length > 1 ? `
      <div class="mt-3 pt-3 border-t border-gray-800">
        <div class="text-xs text-gray-500 mb-1">Fills</div>
        <div class="flex flex-wrap gap-2">
          ${p.fills.map(f => `<span class="text-xs px-2 py-0.5 rounded ${f.action==='BUY'?'bg-emerald-900 text-emerald-300':'bg-red-900 text-red-300'}">${f.action} ${f.pctOfPos.toFixed(0)}% @ $${f.price.toPrecision(4)} · ${f.reason}</span>`).join('')}
        </div>
      </div>` : ''}
    </div>`;
  }).join('') + `</div>`;
}

// ─── Trade Log ────────────────────────────────────────────────────────────────
function renderTrades(trades) {
  if (!trades || !trades.length)
    return `<div class="text-center py-16 text-gray-600">No completed trades yet.</div>`;
  return `<div class="rounded-lg overflow-hidden" style="border:1px solid var(--border)">
  <table class="w-full text-sm">
    <thead><tr class="text-xs text-gray-500 uppercase tracking-wider" style="background:var(--card);border-bottom:1px solid var(--border)">
      <th class="px-4 py-3 text-left">Token</th>
      <th class="px-4 py-3 text-right">Entry</th>
      <th class="px-4 py-3 text-right">Exit</th>
      <th class="px-4 py-3 text-right">Size</th>
      <th class="px-4 py-3 text-right">P&L %</th>
      <th class="px-4 py-3 text-right">P&L $</th>
      <th class="px-4 py-3 text-right">Duration</th>
      <th class="px-4 py-3 text-left">Exit Reason</th>
      <th class="px-4 py-3 text-center">Mode</th>
    </tr></thead>
    <tbody>` +
    trades.map(t => {
      const win = t.pnlPercent >= 0;
      const pnlCls = win ? 'text-emerald-400' : 'text-red-400';
      const rowCls = win ? 'pos-closed-win' : 'pos-closed-loss';
      return `<tr class="row border-b border-gray-800/60 ${rowCls} transition-colors">
        <td class="px-4 py-3"><span class="font-semibold text-white">${t.symbol}</span></td>
        <td class="px-4 py-3 text-right font-mono text-gray-300 text-xs">$${t.entryPrice.toPrecision(4)}</td>
        <td class="px-4 py-3 text-right font-mono text-gray-300 text-xs">$${t.exitPrice.toPrecision(4)}</td>
        <td class="px-4 py-3 text-right text-gray-300">$${t.sizeUSD.toFixed(2)}</td>
        <td class="px-4 py-3 text-right font-bold ${pnlCls}">${win?'+':''}${t.pnlPercent.toFixed(2)}%</td>
        <td class="px-4 py-3 text-right ${pnlCls}">${win?'+':''}$${(t.pnlUSD||0).toFixed(4)}</td>
        <td class="px-4 py-3 text-right text-gray-400">${t.duration}</td>
        <td class="px-4 py-3 text-xs text-gray-400">${t.exitReason}</td>
        <td class="px-4 py-3 text-center">${t.mode==='LIVE'?'<span class="text-xs px-1.5 py-0.5 rounded bg-red-900 text-red-300 font-bold">LIVE</span>':'<span class="text-xs text-gray-600">PAPER</span>'}</td>
      </tr>`;
    }).join('') +
    `</tbody></table></div>`;
}

// ─── Fetch + Refresh ──────────────────────────────────────────────────────────
async function fetchJSON(path) {
  try { return await (await fetch(BASE_URL + path)).json(); }
  catch { return null; }
}

async function refresh() {
  const [stats, tStats] = await Promise.all([fetchJSON('/api/stats'), fetchJSON('/api/trading-stats')]);

  if (stats) {
    document.getElementById('s-tracked').textContent = stats.totalTracked;
    document.getElementById('s-gems').textContent = stats.totalGems;
    document.getElementById('s-strong').textContent = stats.totalStrong;
    document.getElementById('header-stats').innerHTML = `
      <span>Tracked: <b class="text-white">${stats.totalTracked}</b></span>
      <span>Cycles: <b class="text-white">${stats.cycleCount}</b></span>
      <span>Poll: <b class="text-indigo-400">${stats.pollInterval}</b></span>
      <span>Up: <b class="text-white">${stats.uptime}</b></span>`;
  }
  if (tStats) {
    document.getElementById('s-open').textContent = `${tStats.openTrades}/${tStats.maxTrades}`;
    document.getElementById('s-total-trades').textContent = tStats.totalTrades;
    const winEl = document.getElementById('s-winrate');
    winEl.textContent = tStats.totalTrades > 0 ? tStats.winRate.toFixed(0)+'%' : '—';
    winEl.className = 'text-xl font-bold ' + (tStats.winRate >= 50 ? 'text-emerald-400' : 'text-red-400');
    const pnlEl = document.getElementById('s-pnl');
    const pnl = tStats.totalPnLUSD;
    pnlEl.textContent = tStats.totalTrades > 0 ? (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(4) : '—';
    pnlEl.className = 'text-xl font-bold ' + (pnl >= 0 ? 'text-emerald-400' : 'text-red-400');

    const modeEl = document.getElementById('trading-mode');
    if (tStats.mode === 'LIVE') {
      modeEl.textContent = '⚡ LIVE';
      modeEl.className = 'text-xs px-2 py-0.5 rounded font-bold bg-red-900 text-red-300';
    } else {
      modeEl.textContent = '📄 PAPER';
      modeEl.className = 'text-xs px-2 py-0.5 rounded font-bold bg-gray-800 text-gray-400';
    }
  }
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

  if (currentTab === 'all') {
    document.getElementById('token-table').innerHTML = tokenRows(await fetchJSON('/api/tokens'));
  } else if (currentTab === 'gems') {
    document.getElementById('gems-table').innerHTML = tokenRows(await fetchJSON('/api/gems'));
  } else if (currentTab === 'signals') {
    document.getElementById('signals-list').innerHTML = renderSignals(await fetchJSON('/api/signals'));
  } else if (currentTab === 'positions') {
    document.getElementById('positions-list').innerHTML = renderPositions(await fetchJSON('/api/positions'));
  } else if (currentTab === 'trades') {
    document.getElementById('trades-list').innerHTML = renderTrades(await fetchJSON('/api/trades'));
  } else if (currentTab === 'movers') {
    document.getElementById('movers-table').innerHTML = tokenRows(await fetchJSON('/api/movers'));
  } else if (currentTab === 'hot') {
    document.getElementById('hot-table').innerHTML = tokenRows(await fetchJSON('/api/hot'));
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
